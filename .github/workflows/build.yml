name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Generate project
        run: |
          set -e
          mkdir -p _build/src/main/java/com/hitmusic _build/src/main/resources/assets/hitmusic/lang _build/src/main/resources/assets/hitmusic/sounds
          cd _build
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          org.gradle.configuration-cache=false
          minecraft_version=1.21.10
          yarn_mappings=1.21.10+build.2
          loader_version=0.18.1
          loom_version=1.14-SNAPSHOT
          fabric_api_version=0.138.3+1.21.10
          mod_version=4.0.0
          maven_group=com.hitmusic
          archives_base_name=hitmusic
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'hitmusic'
          EOF_FILE
          cat > src/main/resources/fabric.mod.json <<'EOF_FILE'
          {
            "schemaVersion": 1,
            "id": "hitmusic",
            "version": "${version}",
            "name": "Polino Client",
            "description": "Polino Client: hit sound, musik, radar spawner/chest, auto mine, HUD. Buka GUI dengan M atau /hitmusic.",
            "authors": ["The Dark"],
            "environment": "client",
            "entrypoints": {
              "client": ["com.hitmusic.HitMusicClient"]
            },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.10",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF_FILE
          cat > src/main/resources/assets/hitmusic/lang/en_us.json <<'EOF_FILE'
          {
            "key.hitmusic.open": "Buka Hit & Music",
            "key.category.hitmusic.main": "Hit & Music"
          }
          EOF_FILE
          cp ../*.java src/main/java/com/hitmusic/
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p _music _unz
          for z in ../*.zip; do
            [ -e "$z" ] || continue
            unzip -o -q "$z" -d "_unz/$(basename "${z%.*}")" || echo "gagal unzip $z"
          done
          collect() {
            f="$1"
            b=$(basename "${f%.*}")
            ext=$(echo "${f##*.}" | tr 'A-Z' 'a-z')
            if [ "$ext" = "ogg" ]; then
              cp "$f" "_music/$b.ogg"
            else
              ffmpeg -nostdin -y -loglevel error -i "$f" -vn -map_metadata -1 -c:a libvorbis -q:a 3 -ar 44100 "_music/$b.ogg" || echo "gagal convert $f"
            fi
          }
          find .. _unz -maxdepth 4 -type f \( -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' -o -iname '*.flac' \) -not -path '../_build/*' -print0 | while IFS= read -r -d '' f; do collect "$f"; done
          python3 - <<'PYEOF'
          import glob, json, os, re, shutil
          snd = 'src/main/resources/assets/hitmusic/sounds'
          os.makedirs(snd, exist_ok=True)
          TITLES = {'song1': 'Eyes Blue X Terpikat Senyummu', 'song2': 'The One That Got Away', 'song3': 'Mau Dibawa Kemana',
                    'song4': 'COOOK PARDON', 'song5': 'Nina', 'song6': 'Anti-Hero'}
          events = {'hit': {'sounds': [{'name': 'hitmusic:hit'}]}}
          rows = []
          used = set()
          for f in sorted(glob.glob('_music/*.ogg'), key=lambda p: os.path.basename(p).lower()):
              base = os.path.basename(f)[:-4]
              if base.lower() == 'hit':
                  shutil.copy(f, snd + '/hit.ogg')
                  continue
              sid = re.sub(r'[^a-z0-9_]', '_', base.lower())
              n = sid
              i = 2
              while n in used or n == 'hit':
                  n = sid + '_' + str(i)
                  i += 1
              used.add(n)
              shutil.copy(f, snd + '/' + n + '.ogg')
              events[n] = {'sounds': [{'name': 'hitmusic:' + n, 'stream': True}]}
              t = re.sub(r'(?i)[_ -]*spotdown[_ .-]*org$', '', base)
              t = re.sub(r'_+', ' ', t)
              t = re.sub(r'\s+', ' ', t).strip()
              t = re.sub(r'^\d{1,3}\s*[-._)]\s*', '', t).strip() or base
              rows.append((TITLES.get(sid, t), n))
          rows.sort(key=lambda r: r[0].lower())
          json.dump(events, open('src/main/resources/assets/hitmusic/sounds.json', 'w'))
          open('src/main/resources/assets/hitmusic/songs.txt', 'w', encoding='utf-8').write('\n'.join(n + '|' + t for t, n in rows) + '\n')
          print(len(rows), 'lagu terdaftar')
          PYEOF
          ls src/main/java/com/hitmusic
          cat src/main/resources/assets/hitmusic/songs.txt

      - name: Build
        working-directory: _build
        run: |
          echo "### Java files: $(ls ../*.java | xargs -n1 basename | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY
          echo "### Lagu: $(wc -l < src/main/resources/assets/hitmusic/songs.txt) terdaftar" >> $GITHUB_STEP_SUMMARY
          if ! gradle build --no-daemon > build.log 2>&1; then
            echo '### ERROR BUILD' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|What went wrong|FAILED|Could not" -A3 build.log | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -80 build.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hitmusic-mod
          path: _build/build/libs/hitmusic-*.jar
